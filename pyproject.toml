[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matera-vision"
version = "0.1.0"
description = "Matera Vision pipeline for PDF questionnaire processing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pypdfium2==4.30.0",
    "Pillow==10.3.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = [
    ".agents",
    ".venv",
    "build",
    "data"
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # PEP8 errors, pyflakes, isort
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--verbose --tb=short --cov=matera.core --cov=matera.export --cov=matera.data --cov=matera.vision --cov-fail-under=90"
